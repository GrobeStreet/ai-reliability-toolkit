name: Validate submission package
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test input validation and isolated script execution
        run: python -m unittest discover -s tests -v
      - name: Validate bundled resources and build text staging payload
        run: python submission/build_package.py > "$RUNNER_TEMP/agensi-staging.json"
